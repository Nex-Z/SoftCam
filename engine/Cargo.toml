[package]
name = "softcam-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = "=1.5.0"
wasapi = "=0.24.0"
image = { version = "=0.25.6", default-features = false, features = ["png"] }
windows = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi", "Win32_Graphics_Gdi", "Win32_System_Performance"] }

[profile.release]
lto = "thin"
strip = true
